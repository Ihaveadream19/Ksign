name: Build IPA

on:

  push:

    branches: [ "main" ]

  workflow_dispatch:

jobs:

  build:

    runs-on: macos-latest

    steps:

      - name: Checkout

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

      - name: Select Xcode

        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA

        run: |

          make

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: Ksign-IPA

          path: packages/*.ipa
