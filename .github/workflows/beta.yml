name: Beta Build

on:

  push:

    branches: [ "main" ]

  workflow_dispatch:

jobs:

  build:

    name: Build IPA

    runs-on: macos-latest

    steps:

      - name: Checkout Code

        uses: actions/checkout@v4

        with:

          fetch-depth: 0

          submodules: recursive

      - name: Build

        run: |

          make clean package FINALPACKAGE=1

      - name: Upload IPA

        uses: actions/upload-artifact@v4

        with:

          name: Ksign-ipa

          path: packages/*.ipa
